<meta charset="utf-8">
<title>Teinte Ateliers de Couleur</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap">
<style>
/* ============================================================
   MOTEUR DE SITE VITRINE · thème
   Layout : pages "à plat" en bandes de couleur pleine largeur, contenu sur une grille 12 colonnes.
   Les valeurs ci-dessous sont des valeurs par défaut : le moteur les remplace par SITE.theme au démarrage.
   ============================================================ */
:root{
  --paper:#F6F5F1;     /* fond : blanc de craie */
  --paper-2:#EBE8E0;   /* fond secondaire */
  --ink:#1D1C21;       /* texte : noir de vigne */
  --muted:#57544D;     /* texte secondaire (contraste AA sur --paper) */
  --line:#D3CFC5;      /* filets */
  --accent:#2B3BC0;    /* couleur signature (modifiable en direct par le nuancier) */
  --accent-ink:#FFFFFF;/* texte posé sur --accent, calculé automatiquement */
  --f-ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-text:"Newsreader",Georgia,"Times New Roman",serif;
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
  --ease:cubic-bezier(.22,.8,.12,1);
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
img{max-width:100%;display:block}
img[data-powder]:not([src]){visibility:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
::selection{background:var(--accent);color:var(--accent-ink)}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:800}
p{margin:0}
.wrap{max-width:1360px;margin-inline:auto;padding-left:var(--gl);padding-right:var(--gr)}
@media (min-width:900px){.wrap{padding-left:max(40px, env(safe-area-inset-left,0px));padding-right:max(40px, env(safe-area-inset-right,0px))}}
.label{font-family:var(--f-ui);font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.display{font-family:var(--f-ui);font-weight:800;font-stretch:118%;letter-spacing:-.02em;line-height:.98}
.prose{font-family:var(--f-text);font-size:1.18rem;line-height:1.6;max-width:62ch}
.prose em{font-style:italic}
.muted{color:var(--muted)}
.skip{position:absolute;left:-9999px;top:8px;z-index:200;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:6px}
.skip:focus{left:16px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-ui);font-weight:700;font-size:.95rem;padding:15px 22px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);text-decoration:none;cursor:pointer;transition:transform .35s var(--ease),background .3s,color .3s,border-color .3s;line-height:1.1}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:10px 16px;font-size:.85rem}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn .arr{transition:transform .35s var(--ease)}
.btn:hover .arr{transform:translateX(4px)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:.9rem;cursor:pointer;transition:border-color .2s,background .2s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}

/* ---------- header ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:61;background:var(--paper)}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:color-mix(in srgb, var(--paper) 88%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.hd.scrolled{border-bottom-color:var(--line)}
.hd .wrap{display:flex;align-items:center;gap:24px;height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:900;font-stretch:125%;font-size:1.35rem;letter-spacing:-.01em}
.logo i{width:16px;height:16px;border-radius:50%;background:var(--accent);transition:background .6s}
.nav{display:flex;gap:6px;margin-left:auto}
.nav a{text-decoration:none;font-weight:600;font-size:.95rem;padding:9px 14px;border-radius:999px;transition:background .25s}
.nav a:hover{background:var(--paper-2)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.status{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);white-space:nowrap}
.status b{width:8px;height:8px;border-radius:50%;background:#2E8B57;box-shadow:0 0 0 4px rgba(46,139,87,.18)}
.status.closed b{background:#B4452E;box-shadow:0 0 0 4px rgba(180,69,46,.16)}
.cartbtn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:8px 14px;font-weight:700;font-size:.9rem;cursor:pointer}
.cartbtn .n{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:.78rem;transition:background .6s}
.cartbtn.bump .n{animation:bump .5s var(--ease)}
@keyframes bump{40%{transform:scale(1.35)}}
.burger{display:none;border:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:9px 14px;font-weight:700;font-size:.9rem;cursor:pointer}
@media (max-width:980px){.nav,.status{display:none}.burger{display:inline-flex}.cartbtn{margin-left:auto}}
.menu{position:fixed;inset:0;z-index:80;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);padding-left:var(--gl);padding-right:var(--gr)}
.menu-top{display:flex;justify-content:space-between;align-items:center}
.menu-top button{border:1.5px solid currentColor;background:transparent;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer}
.menu nav{display:grid;gap:4px;margin-top:auto;margin-bottom:auto}
.menu nav a{text-decoration:none;font-weight:800;font-stretch:120%;font-size:clamp(2.4rem,11vw,4rem);line-height:1.05;letter-spacing:-.02em}
.menu-foot{display:grid;gap:4px;font-size:.95rem}

/* ---------- page transition ---------- */
.wipe{position:fixed;inset:0;z-index:150;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;pointer-events:none;clip-path:inset(100% 0 0 0);transition:clip-path .5s var(--ease)}
.wipe.in{clip-path:inset(0 0 0 0)}
.wipe.out{clip-path:inset(0 0 100% 0)}
.wipe span{font-weight:900;font-stretch:125%;font-size:clamp(2.5rem,9vw,7rem);letter-spacing:-.03em}

/* ---------- HERO ---------- */
.hero{padding-block:clamp(20px,3vw,36px) clamp(40px,6vw,80px);overflow:hidden}
.hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;color:var(--muted)}
.wordmark{position:relative;margin-block:clamp(10px,2vw,24px)}
.wordmark canvas{display:block;width:100%;aspect-ratio:5/1;touch-action:pan-y;cursor:crosshair}
.wordmark .hint{margin:12px 0 0;justify-content:flex-end;color:var(--muted);font-size:.85rem;display:flex;align-items:center;gap:8px}
.wordmark .hint::before{content:"";width:28px;height:1.5px;background:currentColor}
.hero-grid{display:grid;gap:32px;margin-top:clamp(20px,3vw,40px)}
@media (min-width:980px){.hero-grid{grid-template-columns:1.25fr .9fr .75fr;align-items:end}}
.hero h1{font-size:clamp(2.1rem,4.4vw,3.6rem);font-stretch:112%;line-height:1;letter-spacing:-.025em}
.hero h1 mark{background:none;color:var(--accent);transition:color .6s}
.hero .prose{font-size:1.15rem}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.daycard{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;padding:14px;border-radius:18px;background:var(--paper-2);text-decoration:none;cursor:pointer;border:0;text-align:left;width:100%}
.daycard img{width:96px;height:96px;object-fit:cover;border-radius:12px}
.daycard strong{display:block;font-size:1.15rem;font-stretch:110%}
.daycard .label{color:var(--muted)}

/* ---------- manifesto ---------- */
.manif{background:var(--ink);color:var(--paper);padding-block:clamp(80px,12vw,160px)}
.manif .label{color:color-mix(in srgb, var(--paper) 70%, transparent)}
.manif p.big{font-weight:700;font-stretch:108%;font-size:clamp(1.8rem,4.6vw,4rem);line-height:1.08;letter-spacing:-.02em;max-width:24ch;margin-top:28px}
.manif p.big span{color:color-mix(in srgb, var(--paper) 42%, var(--ink));transition:color .5s}
.manif p.big span.on{color:var(--paper)}
.manif p.big mark{background:none;color:inherit;border-bottom:.08em solid var(--accent)}
.manif .sig{margin-top:40px;display:flex;gap:16px;align-items:center;color:color-mix(in srgb, var(--paper) 75%, transparent)}

/* ---------- carrière (strata) ---------- */
.quarry{padding-block:clamp(80px,10vw,140px) 0}
.sec-head{display:grid;gap:18px;margin-bottom:clamp(30px,4vw,56px)}
@media (min-width:900px){.sec-head{grid-template-columns:1fr 1fr;align-items:end;gap:40px}}
.sec-head h2{font-size:clamp(2.4rem,6.5vw,5.6rem);font-stretch:118%;letter-spacing:-.03em;line-height:.95}
.sec-head .label{color:var(--accent);transition:color .6s}
.strata-box{position:relative}
.strata-box canvas{display:block;width:100%;height:clamp(420px,70vh,720px)}
.legend{display:flex;flex-wrap:wrap;gap:10px 22px;padding-block:22px 0;font-weight:600;font-size:.92rem}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend small{font-weight:500;color:var(--muted)}

/* ---------- gestes (stacking cards) ---------- */
.steps{padding-block:clamp(80px,10vw,140px)}
.stack{display:grid;gap:28px}
.card{position:sticky;top:calc(90px + var(--i) * 14px);min-height:min(76vh,620px);border-radius:28px;padding:clamp(22px,3.5vw,48px);display:grid;gap:26px;transform-origin:50% 0;color:var(--c-ink);background:var(--c-bg);box-shadow:0 -1px 0 rgba(0,0,0,.04);will-change:transform}
@media (min-width:900px){.card{grid-template-columns:1.1fr 1fr;align-items:stretch}}
.card .num{font-weight:900;font-stretch:125%;font-size:clamp(4.5rem,12vw,10rem);line-height:.8;letter-spacing:-.04em}
.card .num small{font-size:.28em;letter-spacing:0;font-weight:700;margin-left:.15em}
.card h3{font-size:clamp(2rem,4vw,3.2rem);font-stretch:115%;letter-spacing:-.02em;margin-top:18px}
.card .prose{font-size:1.12rem;margin-top:14px}
.card .left{display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.card .pic{border-radius:18px;overflow:hidden;min-height:220px;background-size:cover;background-position:center}
@media (max-width:899px){.card{min-height:0;top:calc(80px + var(--i) * 10px)}.card .pic{min-height:0;height:150px}.card .num{font-size:clamp(3.6rem,18vw,5rem)}}
.card .meta{display:flex;flex-wrap:wrap;gap:8px}
.card .meta span{border:1.5px solid currentColor;border-radius:999px;padding:6px 12px;font-weight:600;font-size:.85rem}

/* ---------- nuancier (mixer) ---------- */
.mixer{background:var(--paper-2);padding-block:clamp(80px,10vw,140px)}
.mix-grid{display:grid;gap:clamp(24px,4vw,56px)}
@media (min-width:980px){.mix-grid{grid-template-columns:1fr 1fr;align-items:start}}
.pot-wrap{position:relative;display:grid;place-items:center;aspect-ratio:1;max-width:560px;width:100%;margin-inline:auto}
.pot-wrap canvas{width:100%;height:100%;display:block}
.result{display:grid;gap:6px;margin-top:22px;text-align:center}
.result .name{font-weight:800;font-stretch:115%;font-size:clamp(1.6rem,3vw,2.3rem);letter-spacing:-.02em}
.result .recipe{color:var(--muted)}
.result .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.palette{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.sliders{display:grid;gap:16px;margin-top:26px}
.slider{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;background:var(--paper);border-radius:16px;padding:12px 14px}
.slider label{font-weight:700;display:flex;gap:10px;align-items:center;min-width:0}
.slider input[type=range]{width:100%;accent-color:var(--ink);min-width:0}
.slider .pct{font-weight:700;width:3.2em;text-align:right}
.slider button{border:0;background:transparent;font-size:1.3rem;cursor:pointer;color:var(--muted);line-height:1;padding:4px}
.slider-empty{padding:18px;border:1.5px dashed var(--line);border-radius:16px;color:var(--muted)}
@media (max-width:520px){.slider{grid-template-columns:1fr auto auto}.slider input[type=range]{grid-column:1 / -1;grid-row:2}}

/* ---------- stats ---------- */
.stats{padding-block:clamp(60px,8vw,110px);border-bottom:1px solid var(--line)}
.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 20px}
@media (min-width:900px){.stats-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat strong{display:block;font-weight:900;font-stretch:125%;font-size:clamp(2.8rem,6vw,5rem);line-height:1;letter-spacing:-.03em}
.stat span{display:block;margin-top:8px;color:var(--muted);max-width:22ch}

/* ---------- pigment cards ---------- */
.feat{padding-block:clamp(80px,10vw,140px)}
.grid-p{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:clamp(16px,2vw,26px)}
.pcard{display:grid;gap:12px;text-align:left;background:transparent;border:0;padding:0;cursor:pointer;min-width:0}
.pcard .img{aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:var(--paper-2);position:relative}
.pcard .img img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.pcard:hover .img img{transform:scale(1.06)}
.pcard .img .ci{position:absolute;left:12px;top:12px;background:var(--paper);border-radius:999px;padding:5px 10px;font-weight:700;font-size:.78rem}
.pcard .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.pcard h3{font-size:1.2rem;font-stretch:108%;font-weight:700}
.pcard .price{font-weight:700;white-space:nowrap}
.pcard .sub{color:var(--muted);font-size:.92rem}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:28px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.search{display:flex;gap:10px;align-items:center}
.search input,.search select{font:inherit;font-size:.95rem;padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);min-width:0}
.search input{width:min(260px,100%)}
.count{color:var(--muted);font-weight:600}

/* ---------- testimonials ---------- */
.voices{padding-block:clamp(70px,9vw,120px);background:var(--ink);color:var(--paper)}
.voices .sec-head .label{color:color-mix(in srgb, var(--accent) 55%, var(--paper))}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:min(86%,420px);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:16px;scrollbar-width:thin}
.rail figure{margin:0;scroll-snap-align:start;background:color-mix(in srgb, var(--paper) 8%, var(--ink));border-radius:22px;padding:26px;display:flex;flex-direction:column;justify-content:space-between;gap:26px;min-height:300px}
.rail blockquote{margin:0;font-family:var(--f-text);font-size:1.3rem;line-height:1.4}
.rail figcaption{display:flex;gap:12px;align-items:center}
.rail figcaption .dot{width:36px;height:36px}
.rail figcaption small{display:block;color:color-mix(in srgb, var(--paper) 65%, transparent)}

/* ---------- CTA band ---------- */
.band{background:var(--accent);color:var(--accent-ink);padding-block:clamp(70px,9vw,120px);transition:background .6s,color .6s}
.band-in{display:grid;gap:26px}
@media (min-width:900px){.band-in{grid-template-columns:1.4fr 1fr;align-items:end}}
.band h2{font-size:clamp(2.4rem,6vw,5.2rem);font-stretch:120%;letter-spacing:-.03em;line-height:.95}
.band .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}

/* ---------- page heads ---------- */
.phead{padding-block:clamp(40px,7vw,90px) clamp(30px,4vw,50px)}
.phead h1{font-size:clamp(3rem,10vw,8.5rem);font-stretch:122%;letter-spacing:-.04em;line-height:.9}
.phead .prose{margin-top:22px}
.crumbs{color:var(--muted);margin-bottom:18px}

/* ---------- atelier / booking ---------- */
.ws-list{display:grid;gap:16px}
.ws{display:grid;gap:18px;border:1.5px solid var(--line);border-radius:22px;padding:clamp(18px,2.4vw,28px);cursor:pointer;background:var(--paper);text-align:left;transition:border-color .25s,transform .35s var(--ease);width:100%}
@media (min-width:760px){.ws{grid-template-columns:140px 1fr auto;align-items:center}}
.ws:hover{border-color:var(--ink)}
.ws[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.ws img{width:140px;height:105px;object-fit:cover;border-radius:14px}
.ws h3{font-size:1.45rem;font-stretch:112%}
.ws .info{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);margin-top:6px;font-size:.95rem}
.ws .price{font-weight:800;font-size:1.4rem;font-stretch:115%}
.booking{display:grid;gap:30px;padding-bottom:clamp(80px,10vw,140px)}
@media (min-width:1080px){.booking{grid-template-columns:1.4fr 1fr;align-items:start}}
.panel{background:var(--paper-2);border-radius:26px;padding:clamp(20px,3vw,34px);position:sticky;top:90px}
.steps-nav{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.steps-nav span{padding:6px 12px;border-radius:999px;font-weight:700;font-size:.82rem;background:var(--paper);color:var(--muted)}
.steps-nav span.on{background:var(--ink);color:var(--paper)}
.sessions{display:grid;gap:10px}
.session{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;text-align:left;width:100%}
.session[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.session[disabled]{opacity:.45;cursor:not-allowed}
.session b{font-weight:700}
.session small{color:var(--muted);font-weight:600}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);font-size:1.3rem;cursor:pointer}
.stepper output{font-weight:800;font-size:1.6rem;min-width:2ch;text-align:center}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:.92rem}
.field input,.field select,.field textarea{font:inherit;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);outline:none}
.field .err{color:#A3361F;font-size:.88rem;min-height:1.2em}
.form{display:grid;gap:14px}
.sum{display:grid;gap:8px;border-top:1.5px solid var(--line);padding-top:16px;margin-top:6px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .tot{font-weight:800;font-size:1.25rem}
.note{font-size:.88rem;color:var(--muted)}
.done{display:grid;gap:14px;text-align:left}
.done .ref{font-weight:900;font-stretch:125%;font-size:2rem;letter-spacing:-.01em}

/* ---------- journal ---------- */
.jgrid{display:grid;gap:clamp(20px,3vw,34px);padding-bottom:clamp(80px,10vw,140px)}
@media (min-width:900px){.jgrid{grid-template-columns:1.3fr 1fr}.jgrid a:first-child{grid-row:span 2}}
.jcard{display:grid;gap:14px;text-decoration:none}
.jcard .img{border-radius:22px;overflow:hidden;aspect-ratio:16/10}
.jgrid a:first-child .img{aspect-ratio:4/3}
.jcard .img img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.jcard:hover .img img{transform:scale(1.04)}

/* ---------- atelier & booking ---------- */
const bk = {ws:null, session:null, people:1, step:1, name:'', email:''};
function sessionsFor(w){
  const out = [], d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+2);
  while (out.length < 4){ if (d.getDay() === w.weekday){ const seed = hash(w.id + d.toDateString()); const left = Math.max(0, (seed % (w.capacity + 2)) - 1); out.push({date:new Date(d), left}); } d.setDate(d.getDate()+1); }
  return out;
}
function renderAtelier(){
  section('atelier', `<div class="wrap"><div class="phead"><div class="crumbs label">Ateliers</div><h1>Atelier</h1><p class="prose">Des stages en petit groupe, dans la carrière et dans l'atelier. Le matériel, les pigments et le repas du midi sont compris.</p></div>
    <div class="booking"><div class="ws-list" id="wsList">${SITE.workshops.map(w=>`
      <button class="ws" type="button" data-ws="${w.id}" aria-pressed="false"><img alt="" ${pw(w.hex,'flat',280,210,3,shade(w.hex,-.3))}>
        <div><h3>${esc(w.name)}</h3><p class="muted" style="margin-top:6px">${esc(w.text)}</p><div class="info"><span>${esc(w.duration)}</span><span>${esc(w.level)}</span><span>${w.capacity} places</span></div></div>
        <span class="price tnum">${money(w.price)}</span></button>`).join('')}</div>
      <div class="panel" id="panel" aria-live="polite"></div></div></div>`);
  $('#wsList').addEventListener('click', e => { const b = e.target.closest('[data-ws]'); if(!b) return; bk.ws = b.dataset.ws; bk.session = null; bk.step = 1; $$('#wsList .ws').forEach(x=>x.setAttribute('aria-pressed', x===b)); drawPanel(); if (innerWidth < 1080) $('#panel').scrollIntoView({behavior: reduce?'auto':'smooth', block:'start'}); });
  drawPanel();
}
function drawPanel(){ requestAnimationFrame(() => hydrate($('#panel')));
  const p = $('#panel'), w = SITE.workshops.find(x=>x.id===bk.ws);
  const nav = `<div class="steps-nav">${['Date','Participants','Coordonnées'].map((s,i)=>`<span class="${bk.step===i+1?'on':''}">${i+1}. ${s}</span>`).join('')}</div>`;
  if (!w){ p.innerHTML = `<h2 style="font-size:1.6rem;font-stretch:112%">Réserver un atelier</h2><p class="muted" style="margin-top:10px">Choisissez un atelier dans la liste pour voir les prochaines dates et les places restantes.</p>`; return; }
  const ses = sessionsFor(w);
  const sumHTML = () => `<div class="sum"><div><span>${esc(w.name)}</span><span class="tnum">${money(w.price)} × ${bk.people}</span></div>${bk.session!=null?`<div><span>Date</span><span>${cap(ses[bk.session].date.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}))}, ${esc(w.hour)}</span></div>`:''}<div class="tot"><span>Total</span><span class="tnum">${money(w.price*bk.people)}</span></div></div>`;
  if (bk.step === 1){
    p.innerHTML = `${nav}<h2 style="font-size:1.6rem;font-stretch:112%;margin-bottom:16px">${esc(w.name)}</h2><div class="sessions">${ses.map((s,i)=>`<button class="session" type="button" data-s="${i}" aria-pressed="${bk.session===i}" ${s.left?'':'disabled'}><b>${cap(s.date.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}))} · ${esc(w.hour)}</b><small>${s.left ? `${s.left} place${s.left>1?'s':''}` : 'Complet'}</small></button>`).join('')}</div>${sumHTML()}<div style="margin-top:18px"><button class="btn accent" id="next" type="button" ${bk.session==null?'disabled':''}>Continuer <span class="arr">→</span></button></div>`;
    $$('.session',p).forEach(b=>b.onclick=()=>{ bk.session = +b.dataset.s; bk.people = Math.min(bk.people, ses[bk.session].left); drawPanel(); });
    $('#next').onclick = () => { bk.step = 2; drawPanel(); };
  } else if (bk.step === 2){
    const max = ses[bk.session].left;
    p.innerHTML = `${nav}<h2 style="font-size:1.6rem;font-stretch:112%;margin-bottom:16px">Combien de participants ?</h2><div class="stepper"><button type="button" id="minus" aria-label="Retirer un participant">−</button><output id="ppl" class="tnum">${bk.people}</output><button type="button" id="plus" aria-label="Ajouter un participant">+</button><span class="muted">${max} place${max>1?'s':''} restante${max>1?'s':''}</span></div>${sumHTML()}<div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" id="back" type="button">Retour</button><button class="btn accent" id="next" type="button">Continuer <span class="arr">→</span></button></div>`;
    $('#minus').onclick = () => { bk.people = Math.max(1, bk.people-1); drawPanel(); };
    $('#plus').onclick = () => { bk.people = Math.min(max, bk.people+1); drawPanel(); };
    $('#back').onclick = () => { bk.step = 1; drawPanel(); }; $('#next').onclick = () => { bk.step = 3; drawPanel(); };
  } else if (bk.step === 3){
    p.innerHTML = `${nav}<form class="form" id="bkForm" novalidate><div class="field"><label for="bkName">Nom et prénom</label><input id="bkName" autocomplete="name" value="${esc(bk.name)}"><span class="err" id="eName"></span></div>
      <div class="field"><label for="bkMail">E-mail</label><input id="bkMail" type="email" autocomplete="email" value="${esc(bk.email)}"><span class="err" id="eMail"></span></div>
      ${sumHTML()}<p class="note">${esc(B.demoNotice)}</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" id="back" type="button">Retour</button><button class="btn accent" type="submit">Réserver ${bk.people} place${bk.people>1?'s':''}</button></div></form>`;
    $('#back').onclick = () => { bk.step = 2; drawPanel(); };
    $('#bkForm').onsubmit = e => { e.preventDefault(); bk.name = $('#bkName').value.trim(); bk.email = $('#bkMail').value.trim(); let ok = true;
      $('#eName').textContent = bk.name.length < 2 ? 'Indiquez votre nom pour la liste des participants.' : ''; if (bk.name.length < 2) ok = false;
      const okMail = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(bk.email); $('#eMail').textContent = okMail ? '' : 'Saisissez une adresse e-mail complète, par exemple nom@domaine.fr.'; if (!okMail) ok = false;
      if (ok){ bk.step = 4; drawPanel(); } };
  } else {
    const s = ses[bk.session]; const ref = `${B.name.slice(0,3).toUpperCase()}-${String(s.date.getDate()).padStart(2,'0')}${String(s.date.getMonth()+1).padStart(2,'0')}-${hash(bk.email)%900+100}`;
    p.innerHTML = `<div class="done"><span class="label" style="color:var(--accent)">Demande prête</span><div class="ref">${ref}</div><p>${esc(bk.name)}, votre demande pour <b>${esc(w.name)}</b> le <b style="text-transform:none">${s.date.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</b> à ${esc(w.hour)}, pour ${bk.people} personne${bk.people>1?'s':''}, est enregistrée sur cette page.</p>${sumHTML()}<p class="note">${esc(B.demoNotice)}</p><button class="btn ghost" id="again" type="button">Nouvelle réservation</button></div>`;
    $('#again').onclick = () => { Object.assign(bk,{ws:null,session:null,people:1,step:1}); $$('#wsList .ws').forEach(x=>x.setAttribute('aria-pressed','false')); drawPanel(); };
  }
}

let cart = store.get('cart', {});

function drawCart(){

  d.innerHTML = `<div class="drawer-hd"><h2>Panier</h2><button class="x" type="button" data-close>Fermer</button></div>
    <div class="drawer-body">${ids.length ? ids.map(id=>{ const p = P(id); return `<div class="line"><img alt="" ${pw(p.hex,'mound',300,300,2)}><div><b>${esc(p.name)}</b><div class="muted" style="font-size:.88rem">${esc(p.ci)} · ${esc(SITE.unit)}</div>

    ${ids.length ? `<div class="drawer-ft"><div class="note">${sub >= free ? 'Livraison offerte.' : `Plus que ${money(free-sub)} pour la livraison offerte.`}</div><div class="ship"><i style="width:${clamp(sub/free*100,0,100)}%"></i></div>
      <div class="sum" style="border:0;padding:0"><div><span>Sous-total</span><span class="tnum">${money(sub)}</span></div><div><span>Livraison</span><span class="tnum">${ship ? money(ship) : 'Offerte'}</span></div><div class="tot"><span>Total</span><span class="tnum">${money(sub+ship)}</span></div></div>
      <button class="btn accent" type="button" id="checkout" style="justify-content:center">Valider la commande</button><p class="note" id="coNote"></p></div>` : ''}`;

}

/* ---------- hero: powder + binder = paint ----------
   The grains start as a heap of powder, rise into the letters, then each letter "binds" into solid paint.
   Touching a letter grinds it back into powder; it re-forms and binds again. */
const hero = {cv:null, x:null, parts:[], letters:[], w:0, h:0, dpr:1, ptr:{x:-9999,y:-9999,active:false}, visible:true, t0:0, font:'', base:0};
function letterColors(){ const c = SITE.hero.letterColors; if (c && c.length) return c; const p = SITE.hero.particleColors; return [...SITE.hero.word].map((_,i) => p[(i*3 + 4) % p.length]); }
function buildHero(){
  const cv = hero.cv = $('#heroCv'); if (!cv) return;
  const w = cv.parentElement.clientWidth; if (!w) return; const dpr = hero.dpr = Math.min(devicePixelRatio||1, 2);
  const word = SITE.hero.word, chars = [...word], fam = SITE.theme.fontUi;
  const off = document.createElement('canvas').getContext('2d');
  let fs = 200; const fontOf = s => `900 ${s}px "${fam}"`;
  off.font = fontOf(fs); fs = fs * (w*.985) / off.measureText(word).width; off.font = fontOf(fs);
  const m = off.measureText(word); const asc = m.actualBoundingBoxAscent || fs*.72, desc = m.actualBoundingBoxDescent || 0;
  const h = Math.ceil(asc + desc + fs*.1);
  hero.w = w; hero.h = h; hero.font = fontOf(fs); hero.base = asc + fs*.05;
  cv.style.height = h + 'px'; cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const oc = off.canvas; oc.width = w; oc.height = h; off.font = hero.font; off.textBaseline = 'alphabetic'; off.fillStyle = '#000';
  const x0 = (w - off.measureText(word).width)/2; off.fillText(word, x0, hero.base);
  const cols = letterColors(); const r = rng(7);
  hero.letters = chars.map((ch,i) => { const lx = x0 + off.measureText(chars.slice(0,i).join('')).width; const col = cols[i % cols.length];
    return {ch, x:lx, w:off.measureText(ch).width, color:col, V:variants(col, 5, -.28, .2), bind: reduce ? 1 : 0, n:0, d:0, groups:[[],[],[],[],[]]}; });
  const img = off.getImageData(0,0,w,h).data;
  const step = w < 520 ? 2 : w < 900 ? 4 : 5;
  hero.parts = [];
  for (let y=0; y<h; y+=step) for (let x=0; x<w; x+=step){
    if (img[(y*w + x)*4 + 3] < 128) continue;
    let li = hero.letters.findIndex(L => x >= L.x && x < L.x + L.w); if (li < 0) li = x < w/2 ? 0 : hero.letters.length-1;

    hero.parts.push(p); hero.letters[li].groups[Math.floor(r()*5)].push(p); hero.letters[li].n++;
  }
  hero.x = cv.getContext('2d'); hero.x.setTransform(dpr,0,0,dpr,0,0); hero.t0 = performance.now();
}
function stepHero(t){
  if (!hero.x) return; const x = hero.x, {w,h,ptr,letters} = hero; const el = t - hero.t0; const R = Math.max(50, w*.06), R2 = R*R;
  x.clearRect(0,0,w,h);
  letters.forEach(L => L.d = 0);
  for (const p of hero.parts){
    if (el > p.d){
      p.vx += (p.hx - p.x) * .05; p.vy += (p.hy - p.y) * .05;
      if (ptr.active){ const dx = p.x - ptr.x, dy = p.y - ptr.y, d2 = dx*dx + dy*dy; if (d2 < R2){ const f = (1 - d2/R2) * 8; const d = Math.sqrt(d2) || 1; p.vx += dx/d*f; p.vy += dy/d*f; } }
      p.vx *= .8; p.vy *= .8; p.x += p.vx; p.y += p.vy;
    }
    letters[p.L].d += Math.abs(p.hx - p.x) + Math.abs(p.hy - p.y);
  }
  x.font = hero.font; x.textBaseline = 'alphabetic';
  for (const L of letters){
    const avg = L.d / (L.n || 1);
    if (avg < 1.5) L.bind = Math.min(1, L.bind + .022); else L.bind = Math.max(0, L.bind - (avg > 6 ? .2 : .05));
    if (L.bind < 1){ x.globalAlpha = 1 - L.bind*.9; L.groups.forEach((g,k) => { x.fillStyle = L.V[k]; for (const p of g) x.fillRect(p.x, p.y, p.s, p.s); }); }

}
function heroPointer(e){ const r = hero.cv.getBoundingClientRect(); hero.ptr.x = e.clientX - r.left; hero.ptr.y = e.clientY - r.top; hero.ptr.active = true; }
function heroBurst(e){ heroPointer(e); const {x:px, y:py} = hero.ptr; for (const p of hero.parts){ const dx = p.x-px, dy = p.y-py, d = Math.hypot(dx,dy)||1; if (d < hero.w*.2){ const f = (1 - d/(hero.w*.2))*34; p.vx += dx/d*f; p.vy += dy/d*f - 5; } } }

/* ---------- quarry strata ---------- */
let grainPat = null;
function drawStrata(){
  const cv = $('#strataCv'); if (!cv || cv.closest('.view').hidden) return;
  const r = cv.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
  const dpr = Math.min(devicePixelRatio||1, 2), W = r.width, H = r.height;
  if (cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); }
  const x = cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  const prog = clamp((innerHeight - r.top) / (innerHeight + H), 0, 1);
  const sky = x.createLinearGradient(0,0,0,H*.3); sky.addColorStop(0,'#C9D6E2'); sky.addColorStop(1, SITE.theme.paper); x.fillStyle = sky; x.fillRect(0,0,W,H);
  const L = SITE.quarry.layers, n = L.length;
  const nz = (X,i) => Math.sin(X*.0042 + i*1.7)*.55 + Math.sin(X*.0113 + i*3.1)*.3 + Math.sin(X*.031 + i*.7)*.15;
  const topOf = (X,i) => H*(.16 + i*(.84/n)) + (prog-.5)*H*.18*(i/n) + nz(X,i)*H*.045 - (i===0 ? Math.max(0, Math.sin(X*.0022+1))*H*.06 : 0);
  for (let i=0;i<n;i++){
    x.beginPath(); x.moveTo(0,H); for (let X=0; X<=W+8; X+=8) x.lineTo(X, topOf(X,i)); x.lineTo(W,H); x.closePath();
    const g = x.createLinearGradient(0, topOf(0,i), 0, H); g.addColorStop(0, shade(L[i].hex,.1)); g.addColorStop(.25, L[i].hex); g.addColorStop(1, shade(L[i].hex,-.2)); x.fillStyle = g; x.fill();
  }
  // erosion flutes typical of ochre cliffs
  const rr = rng(99); x.lineCap = 'round';
  for (let k=0;k<W/9;k++){ const X = rr()*W, i = Math.floor(rr()*n), y0 = topOf(X,i) + 4, len = 30 + rr()*H*.25; x.strokeStyle = `rgba(40,20,10,${.05 + rr()*.09})`; x.lineWidth = 1 + rr()*3; x.beginPath(); x.moveTo(X,y0); x.quadraticCurveTo(X + (rr()-.5)*8, y0+len/2, X + (rr()-.5)*6, y0+len); x.stroke();
    x.strokeStyle = `rgba(255,240,220,${.05 + rr()*.07})`; x.lineWidth = 1; x.beginPath(); x.moveTo(X+2,y0); x.lineTo(X+3,y0+len*.7); x.stroke(); }
  // pines on the crest

    x.beginPath(); x.ellipse(X, y - s*.9, s*1.1, s*.65, 0, 0, Math.PI*2); x.fill(); x.fillRect(X-1, y - s*.4, 2, s*.5); }
  if (!grainPat){ const gc = document.createElement('canvas'); gc.width = gc.height = 160; const gx = gc.getContext('2d'), gi = gx.createImageData(160,160), gr = rng(5); for (let i=0;i<gi.data.length;i+=4){ const v = gr()*255; gi.data[i]=gi.data[i+1]=gi.data[i+2]=v; gi.data[i+3]=38; } gx.putImageData(gi,0,0); grainPat = x.createPattern(gc,'repeat'); }
  x.globalCompositeOperation = 'overlay'; x.fillStyle = grainPat; x.fillRect(0,0,W,H); x.globalCompositeOperation = 'source-over';
}

/* ---------- manifesto words ---------- */
function updateManif(){ const el = $('#manifText'); if (!el || el.closest('.view').hidden) return; const mid = innerHeight*.66; $$('span', el).forEach(s => s.classList.toggle('on', s.getBoundingClientRect().top < mid)); }

/* ---------- process stack ---------- */
function updateStack(){ const cards = $$('#stack .card'); if (!cards.length || cards[0].closest('.view').hidden || reduce) return;
  cards.forEach((c,i) => { const nx = cards[i+1]; if (!nx){ c.style.transform = ''; return; } const k = clamp(1 - (nx.getBoundingClientRect().top - c.getBoundingClientRect().top) / c.offsetHeight, 0, 1); c.style.transform = `scale(${1 - k*.06})`; c.style.filter = `brightness(${1 - k*.18})`; }); }

/* ---------- mixer ---------- */
let mixSel = SITE.mixer.defaults.map(d=>({...d}));
const pot = {parts:[], t0:0, hex:'#888888', visible:false};
function syncMixer(){
  $$('#palette .chip').forEach(c => c.setAttribute('aria-pressed', !!mixSel.find(m=>m.id===c.dataset.mix)));
  const sl = $('#sliders');
  sl.innerHTML = mixSel.length ? mixSel.map(m=>{ const p = P(m.id); return `<div class="slider"><label for="mw-${m.id}"><i class="dot" style="background:${p.hex}"></i><span>${esc(p.name)}</span></label><input type="range" id="mw-${m.id}" min="1" max="100" value="${m.w}" data-w="${m.id}"><span class="pct tnum" id="pct-${m.id}"></span><button type="button" data-unmix="${m.id}" aria-label="Retirer ${esc(p.name)}">×</button></div>`; }).join('')
    : `<div class="slider-empty">Choisissez au moins un pigment ci-dessus pour commencer le mélange.</div>`;
  $$('[data-w]', sl).forEach(i => i.oninput = () => { mixSel.find(m=>m.id===i.dataset.w).w = +i.value; updateMix(false); });
  $$('[data-unmix]', sl).forEach(b => b.onclick = () => { mixSel = mixSel.filter(m=>m.id!==b.dataset.unmix); syncMixer(); });

function updateMix(restir){
  const tot = mixSel.reduce((s,m)=>s+m.w,0);
  mixSel.forEach(m => { const el = $('#pct-'+m.id); if (el) el.textContent = Math.round(m.w/tot*100) + ' %'; });
  pot.hex = mixSel.length ? mixColors(mixSel.map(m=>({hex:P(m.id).hex, w:m.w}))) : SITE.theme.paper2;
  $('#mixName').textContent = mixSel.length ? nameColor(pot.hex) : 'Pot vide';
  $('#mixRecipe').textContent = mixSel.map(m=>`${Math.round(m.w/tot*100)} % ${P(m.id).name}`).join(' · ');
  $('#mixHex').textContent = mixSel.length ? pot.hex : '';

  if (restir){ const r = rng(Date.now()%1e6); pot.parts = []; mixSel.forEach(m => { const n = Math.round(m.w/tot*420); for (let i=0;i<n;i++) pot.parts.push({a:r()*Math.PI*2, rad:.15 + r()*.8, sp:(.004 + r()*.012)*(r()<.5?1:-1), c:P(m.id).hex, s:2+r()*4}); }); pot.t0 = performance.now(); }

function drawPot(t){

function bindMixer(){
  $('#palette').addEventListener('click', e => { const b = e.target.closest('[data-mix]'); if (!b) return; const id = b.dataset.mix; const i = mixSel.findIndex(m=>m.id===id);
    if (i >= 0) mixSel.splice(i,1); else { if (mixSel.length >= 3){ toast('Trois pigments au maximum. Le premier choisi a été retiré.'); mixSel.shift(); } mixSel.push({id, w:35}); } syncMixer(); });

  $('#mixCopy').onclick = () => { (navigator.clipboard ? navigator.clipboard.writeText(pot.hex) : Promise.reject()).then(()=>toast(`${pot.hex} copié`)).catch(()=>toast(`Code couleur : ${pot.hex}`)); };

/* ---------- counters ---------- */
const counted = new WeakSet();
const countIO = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting || counted.has(e.target) || reduce) return; counted.add(e.target);
  const el = e.target, to = +el.dataset.count, suf = el.dataset.suffix, t0 = performance.now();
  const f = t => { const k = clamp((t-t0)/1400,0,1), v = Math.round(to*(1-Math.pow(1-k,3))); el.textContent = v + suf; if (k<1) requestAnimationFrame(f); }; requestAnimationFrame(f); }), {threshold:.6});

/* ==================================================================
   4. ROUTAGE  (#accueil, #pigments, #atelier, #journal, #contact, #lire-xxx)
   ================================================================== */
const VIEWS = SITE.nav.map(n=>n.id);
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return {view:VIEWS[0]};
  if (VIEWS.includes(h)) return {view:h};
  if (h.startsWith('lire-')) return {view:'article', id:h.slice(5)};
  const el = document.getElementById(h); if (el && el.closest('.view')) return {view: el.closest('.view').dataset.view, anchor:h};
  return {view:VIEWS[0]};
}
let current = null;
function show(r){
  if (r.view === 'article') renderArticle(r.id);
  $$('.view').forEach(v => v.hidden = v.dataset.view !== r.view);
  current = r.view;
  const navId = r.view === 'article' ? 'journal' : r.view;
  $$('[data-nav]').forEach(a => a.dataset.nav === navId ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  $('#readbar').hidden = r.view !== 'article';
  const t = r.anchor ? document.getElementById(r.anchor) : null;
  if (t) t.scrollIntoView({block:'start'}); else scrollTo(0,0);
  hydrate($(`[data-view="${r.view}"]`));
  if (r.view === VIEWS[0] && fontsOK && !hero.parts.length) buildHero();
  const label = r.view === 'article' ? (SITE.journal.find(a=>a.id===r.id)||{}).title : (SITE.nav.find(n=>n.id===r.view)||{}).label;
  document.title = r.view === VIEWS[0] ? `${B.name} Ateliers de Couleur` : `${label} · ${B.name}`;
  onScroll();
}
function wipeTo(r, label, mid){
  const w = $('#wipe'); if (reduce){ mid && mid(); r && show(r); return; }
  $('#wipeLabel').textContent = label || ''; w.classList.remove('out'); w.classList.add('in');
  setTimeout(() => { mid && mid(); r && show(r); w.classList.add('out'); setTimeout(() => w.classList.remove('in','out'), 520); }, 520);
}
addEventListener('hashchange', () => { const r = route(); if (r.view === current && r.anchor){ document.getElementById(r.anchor).scrollIntoView({behavior: reduce?'auto':'smooth', block:'start'}); return; }
  const label = r.view === 'article' ? 'Journal' : (SITE.nav.find(n=>n.id===r.view)||{}).label; wipeTo(r, label); });

/* ---------- scroll + loop ---------- */
function onScroll(){
  $('#hd').classList.toggle('scrolled', scrollY > 10);
  updateManif(); updateStack(); drawStrata();
  if (current === 'article'){ const a = $('[data-view="article"] article'); if (a){ const k = clamp((scrollY - a.offsetTop + innerHeight*.3)/(a.offsetHeight - innerHeight*.7), 0, 1); $('#readbar').style.transform = `scaleX(${k})`; } }
}
let scrollQueued = false; addEventListener('scroll', () => { if (scrollQueued) return; scrollQueued = true; requestAnimationFrame(() => { scrollQueued = false; onScroll(); }); }, {passive:true});
function loop(t){
  if (current === VIEWS[0]){
    if (hero.visible) stepHero(t);
    if (pot.visible) drawPot(t);
  }
  requestAnimationFrame(loop);
}
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const w = hero.cv && hero.cv.parentElement.clientWidth; if (w && Math.abs(w - hero.w) > 2) buildHero(); grainPat = null; onScroll(); }, 160); });

/* ---------- boot ---------- */
function boot(){
  applyTheme(); renderHeader(); renderHome(); renderPigments(); renderAtelier(); renderJournal(); renderContact(); renderFooter();
  updateCartBadge(); bindMixer();
  $$('[data-count]').forEach(el => countIO.observe(el));
  const hc = $('#heroCv');
  new IntersectionObserver(e => hero.visible = e[0].isIntersecting).observe(hc);
  new IntersectionObserver(e => pot.visible = e[0].isIntersecting).observe($('#potCv'));
  hc.addEventListener('pointermove', heroPointer); hc.addEventListener('pointerleave', () => hero.ptr.active = false);
  hc.addEventListener('pointerdown', heroBurst); hc.addEventListener('pointerup', () => { if (!fine) hero.ptr.active = false; });
  current = null; show(route());
  if (reduce){ drawPot(1e9); setInterval(()=>{ stepHero(performance.now()); }, 80); }
  requestAnimationFrame(loop);
  setInterval(() => { const s = $('#status'), st = openState(); if (s){ s.className = 'status' + (st.open ? '' : ' closed'); s.lastChild.textContent = st.text; } }, 60e3);
}
